<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Assessment Report{% endblock %}</title>
    
    <style>
        /* Print-specific styles for WeasyPrint */
        @page {
            size: A4;
            margin: 2.5cm 2cm;
            @top-center {
                content: "A M AI SAFE Framework Assessment";
                font-size: 10pt;
                color: #666;
            }
            @bottom-center {
                content: "Page " counter(page);
                font-size: 10pt;
                color: #666;
            }
        }
        
        body {
            font-family: 'Arial', sans-serif;
            font-size: 11pt;
            line-height: 1.4;
            color: #333;
            margin: 0;
            padding: 0;
        }
        
        /* Header styling */
        .report-header {
            background: linear-gradient(135deg, #0891b2 0%, #0e7490 100%);
            color: white;
            padding: 20pt;
            margin-bottom: 20pt;
            text-align: center;
        }
        
        .report-title {
            font-size: 18pt;
            font-weight: bold;
            margin-bottom: 5pt;
        }
        
        .report-subtitle {
            font-size: 14pt;
            margin-bottom: 10pt;
        }
        
        .report-date {
            font-size: 10pt;
            opacity: 0.9;
        }
        
        /* Headings */
        h1 {
            font-size: 16pt;
            font-weight: bold;
            color: #0891b2;
            margin-top: 25pt;
            margin-bottom: 15pt;
            page-break-after: avoid;
        }
        
        h2 {
            font-size: 14pt;
            font-weight: bold;
            color: #333;
            margin-top: 20pt;
            margin-bottom: 10pt;
            page-break-after: avoid;
        }
        
        h3 {
            font-size: 12pt;
            font-weight: bold;
            color: #333;
            margin-top: 15pt;
            margin-bottom: 8pt;
            page-break-after: avoid;
        }
        
        /* Page break controls */
        .page-break {
            page-break-before: always;
        }
        
        .no-break {
            break-inside: avoid;
            page-break-inside: avoid;
        }
        
        /* Table styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15pt 0;
            break-inside: avoid;
        }
        
        th, td {
            border: 1pt solid #ddd;
            padding: 8pt;
            text-align: left;
            vertical-align: top;
        }
        
        th {
            background-color: #f8f9fa;
            font-weight: bold;
            font-size: 10pt;
        }
        
        td {
            font-size: 10pt;
        }
        
        /* Summary section styling */
        .executive-summary {
            background: #f8f9fa;
            border: 1pt solid #dee2e6;
            padding: 15pt;
            margin: 20pt 0;
            break-inside: avoid;
        }
        
        .summary-grid {
            display: flex;
            justify-content: space-between;
            margin-top: 10pt;
        }
        
        .summary-item {
            text-align: center;
            flex: 1;
        }
        
        .summary-label {
            font-size: 10pt;
            font-weight: bold;
            color: #666;
            margin-bottom: 5pt;
        }
        
        .summary-value {
            font-size: 14pt;
            font-weight: bold;
            color: #0891b2;
        }
        
        /* Heatmap styling */
        .heatmap-container {
            width: 100%;
            margin: 20pt 0;
            break-inside: avoid;
        }
        
        .heatmap-title {
            font-size: 12pt;
            font-weight: bold;
            margin-bottom: 10pt;
            text-align: center;
        }
        
        .heatmap-description {
            font-size: 10pt;
            color: #666;
            margin-bottom: 15pt;
            text-align: center;
            font-style: italic;
        }
        
        .heatmap-grid {
            display: grid;
            grid-template-columns: auto repeat(8, 1fr);
            gap: 1pt;
            margin: 15pt 0;
        }
        
        .heatmap-header {
            background: #e9ecef;
            padding: 5pt;
            font-size: 9pt;
            font-weight: bold;
            text-align: center;
            border: 1pt solid #dee2e6;
        }
        
        .heatmap-row-label {
            background: #e9ecef;
            padding: 5pt;
            font-size: 9pt;
            font-weight: bold;
            text-align: left;
            border: 1pt solid #dee2e6;
            white-space: nowrap;
        }
        
        .heatmap-cell {
            padding: 3pt;
            text-align: center;
            font-size: 8pt;
            font-weight: bold;
            color: white;
            border: 1pt solid #dee2e6;
            min-height: 20pt;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Score color coding */
        .score-excellent { background-color: #22c55e; }
        .score-good { background-color: #84cc16; }
        .score-fair { background-color: #eab308; }
        .score-poor { background-color: #ef4444; }
        
        /* Recommendations styling */
        .recommendations-section {
            margin: 25pt 0;
        }
        
        .priority-section {
            margin: 20pt 0;
            break-inside: avoid;
        }
        
        .priority-title {
            font-size: 14pt;
            font-weight: bold;
            margin-bottom: 15pt;
            padding-bottom: 5pt;
            border-bottom: 2pt solid #0891b2;
        }
        
        .recommendation-item {
            margin: 12pt 0;
            padding: 10pt;
            background: #f8f9fa;
            border-left: 4pt solid #0891b2;
            break-inside: avoid;
        }
        
        .recommendation-domain {
            font-weight: bold;
            color: #0891b2;
            font-size: 10pt;
        }
        
        .recommendation-question {
            font-size: 9pt;
            color: #666;
            margin: 2pt 0;
        }
        
        .recommendation-text {
            font-size: 10pt;
            margin-top: 5pt;
        }
        
        /* Table of contents styling */
        .toc {
            margin: 20pt 0;
            break-inside: avoid;
        }
        
        .toc-item {
            display: flex;
            justify-content: space-between;
            padding: 5pt 0;
            border-bottom: 1pt dotted #ddd;
        }
        
        .toc-title {
            flex: 1;
        }
        
        .toc-page {
            font-weight: bold;
        }
        
        /* Utility classes */
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .bold { font-weight: bold; }
        .italic { font-style: italic; }
        .small { font-size: 9pt; }
        
        /* Content spacing */
        .content-section {
            margin: 20pt 0;
        }
        
        p {
            margin: 8pt 0;
            text-align: justify;
        }
        
        ul, ol {
            margin: 10pt 0;
            padding-left: 20pt;
        }
        
        li {
            margin: 5pt 0;
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
